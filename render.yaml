services:
  - type: web
    name: vaultic-backend
    env: python
    region: oregon
    plan: free
    rootDir: fintechbackend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VAULTIC_SECRET_KEY
        generateValue: true
      - key: VAULTIC_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: DEBUG_MODE
        value: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: API_V1_PREFIX
        value: /api/v1
