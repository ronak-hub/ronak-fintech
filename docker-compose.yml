version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vaultic-postgres
    environment:
      POSTGRES_USER: vaultic_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: vaultic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultic_user -d vaultic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaultic-network

  # FastAPI Backend
  backend:
    build:
      context: ./fintechbackend
      dockerfile: Dockerfile
    container_name: vaultic-backend
    env_file:
      - ./fintechbackend/.env
    environment:
      DATABASE_URL: postgresql://vaultic_user:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/vaultic_db
      ENVIRONMENT: development
      DEBUG_MODE: "true"
      PRIVATE_KEY_PATH: /app/keys/private.pem
      PUBLIC_KEY_PATH: /app/keys/public.pem
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./fintechbackend:/app
      - vaultic_keys:/app/keys
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - vaultic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: ./finitch-frontend
      dockerfile: Dockerfile.dev
    container_name: vaultic-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./finitch-frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - vaultic-network

  # Nginx Reverse Proxy (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: vaultic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vaultic-network
    profiles:
      - prod

volumes:
  postgres_data:
    driver: local
  vaultic_keys:
    driver: local

networks:
  vaultic-network:
    driver: bridge
